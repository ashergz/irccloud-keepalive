name: IRCCloud Keepalive

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: irccloud-keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install --ignore-scripts
      - name: Run keepalive
        env:
          IRCLOUD_EMAIL: ${{ secrets.IRCLOUD_EMAIL }}
          IRCLOUD_PASSWORD: ${{ secrets.IRCLOUD_PASSWORD }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: node keepalive.mjs
      - name: Save successful timestamp
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name "irccloud-keepalive"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Update keepalive state"
          git push
