name: GitHub Schedule Probe

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm scheduled trigger
        run: |
          echo "Schedule probe fired."
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
